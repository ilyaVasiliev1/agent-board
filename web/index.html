<!doctype html>
<html lang="ru" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Доска агентов</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand"><span class="mark" aria-hidden="true"></span>Агенты</div>
      <label class="project">
        <span class="sr">Проект</span>
        <select id="project"></select>
      </label>
      <nav class="env" id="env" aria-label="Стенды проекта"></nav>
      <span class="spacer"></span>
      <span id="sync" class="sync" role="status"></span>
      <button id="btn-settings" class="icon" aria-label="Настройки" title="Настройки">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>
      </button>
      <button id="btn-help" class="icon" aria-label="Горячие клавиши" title="Горячие клавиши (?)">?</button>
    </header>

    <section class="composer" aria-label="Новая задача">
      <textarea id="c-text" rows="1" placeholder="Что нужно сделать? Опишите своими словами, первая строка станет заголовком" aria-label="Текст задачи"></textarea>
      <div class="c-row">
        <label class="pick"><span>Модель</span><select id="c-model"></select></label>
        <label class="pick"><span>Усилие</span><select id="c-effort"></select></label>
        <span class="c-hint" id="c-hint"></span>
        <label class="tog" id="c-auto-wrap" hidden title="Если тесты в облаке зелёные, результат сразу вливается в staging без вашей проверки"><input type="checkbox" id="c-auto" /><span>Без проверки при зелёных тестах</span></label>
        <span class="spacer"></span>
        <button id="c-idea" type="button">Сохранить в идеи</button>
        <button id="c-send" type="button" class="primary">Отправить в облако <kbd>⌘↵</kbd></button>
      </div>
    </section>

    <main class="layout" id="layout">
      <div class="board" id="board" role="list"></div>
      <aside class="pane" id="pane" aria-label="Задача" hidden></aside>
    </main>

    <dialog id="dlg-settings">
      <form method="dialog" class="dlg">
        <h2>Настройки</h2>
        <p class="dlg-note">Значения по умолчанию подставляются в новые задачи. Менять их для отдельной задачи можно при отправке.</p>
        <label class="field"><span>Модель по умолчанию</span><select id="s-model"></select></label>
        <label class="field"><span>Уровень усилий по умолчанию</span><select id="s-effort"></select></label>
        <fieldset class="field">
          <legend>Тема</legend>
          <div class="seg" id="s-theme" role="radiogroup" aria-label="Тема">
            <button type="button" role="radio" data-v="auto">Как в системе</button>
            <button type="button" role="radio" data-v="light">Светлая</button>
            <button type="button" role="radio" data-v="dark">Тёмная</button>
          </div>
        </fieldset>
        <menu><button value="close" class="primary">Готово</button></menu>
      </form>
    </dialog>

    <dialog id="dlg-help">
      <form method="dialog" class="dlg">
        <h2>Горячие клавиши</h2>
        <dl class="keys">
          <dt><kbd>N</kbd></dt><dd>Новая задача</dd>
          <dt><kbd>J</kbd> <kbd>K</kbd></dt><dd>Следующая и предыдущая карточка</dd>
          <dt><kbd>Esc</kbd></dt><dd>Закрыть панель задачи</dd>
          <dt><kbd>⌘</kbd><kbd>↵</kbd></dt><dd>Отправить задачу в облако</dd>
          <dt><kbd>⌘</kbd><kbd>⇧</kbd><kbd>↵</kbd></dt><dd>Сохранить в идеи</dd>
          <dt><kbd>?</kbd></dt><dd>Эта подсказка</dd>
        </dl>
        <menu><button value="close" class="primary">Понятно</button></menu>
      </form>
    </dialog>

    <div id="toasts" aria-live="polite"></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
